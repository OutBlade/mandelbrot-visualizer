<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mandelbrot Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #0a0a0f; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 7px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.35rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ver-pill {
            font-size: 0.68rem;
            color: #888;
            background: #1a1a2e;
            padding: 3px 10px;
            border-radius: 12px;
        }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 10px;
            padding: 0 10px 10px;
        }
        .canvas-wrap {
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 36px rgba(102,126,234,0.22);
            position: relative;
            min-width: 0;
        }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        .overlay {
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-size: 0.63rem;
            color: #777;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 4px;
        }
        .overlay span { color: #667eea; }
        .fs-hint {
            position: absolute;
            top: 8px; right: 10px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.28);
            pointer-events: none;
            display: none;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 198px;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .panel { background: #1a1a2e; border-radius: 10px; padding: 12px; }
        .pt {
            font-size: 0.72rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .btn {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.78rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.12s, background 0.12s;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .btn:last-child { margin-bottom: 0; }
        .btn:hover { transform: translateY(-1px); }
        .btn-sec { background: #252540; color: #ccc; }
        .btn-sec:hover { background: #2d2d50; color: #fff; }
        .btn-rec { background: #b02020; color: #fff; }
        .btn-rec.active { background: #228b22; }
        .slider { margin-bottom: 8px; }
        .sl-label { display: flex; justify-content: space-between; font-size: 0.68rem; color: #aaa; margin-bottom: 3px; }
        input[type=range] {
            width: 100%; height: 4px; border-radius: 2px;
            background: #252540; outline: none; -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 13px; height: 13px;
            border-radius: 50%; background: #667eea; cursor: pointer;
        }
        .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .cbtn {
            padding: 6px 4px; font-size: 0.68rem;
            border: 1px solid #333; border-radius: 5px;
            background: #252540; color: #bbb; cursor: pointer;
        }
        .cbtn:hover { background: #2d2d50; color: #fff; }
        .cbtn.active { border-color: #667eea; background: #2d2d50; color: #fff; }
        .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .pbtn {
            padding: 6px 4px; font-size: 0.63rem;
            border: 1px solid #2a2a44; border-radius: 5px;
            background: #1e1e38; color: #bbb; cursor: pointer;
        }
        .pbtn:hover { background: #2d2d50; color: #fff; }
        .pbar-wrap { width: 100%; height: 3px; background: #252540; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .pbar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.05s; }
        .ptext { font-size: 0.63rem; color: #777; margin-top: 3px; }

        body.fs .header,
        body.fs .sidebar { display: none; }
        body.fs .main { padding: 0; }
        body.fs .canvas-wrap { border-radius: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mandelbrot Visualizer</h1>
        <span class="ver-pill" id="ver">Loading...</span>
    </div>
    <div class="main">
        <div class="canvas-wrap">
            <canvas id="c"></canvas>
            <div class="overlay"><span id="coords">-0.5 + 0i</span> &nbsp;|&nbsp; <span id="zoomInfo">1x</span></div>
            <div class="fs-hint" id="fsHint">Press F or Esc to exit fullscreen</div>
        </div>
        <div class="sidebar">
            <div class="panel">
                <div class="pt">View</div>
                <button class="btn btn-sec" id="fsBtn">Fullscreen  [F]</button>
                <button class="btn btn-sec" id="ziBtn">Zoom In</button>
                <button class="btn btn-sec" id="zoBtn">Zoom Out</button>
                <button class="btn btn-sec" id="rstBtn">Reset</button>
            </div>
            <div class="panel">
                <div class="pt">Presets</div>
                <div class="pgrid">
                    <button class="pbtn" data-p="spiral">Spiral</button>
                    <button class="pbtn" data-p="seahorse">Seahorse</button>
                    <button class="pbtn" data-p="elephant">Elephant</button>
                    <button class="pbtn" data-p="valley">Valley</button>
                    <button class="pbtn" data-p="triple">Triple</button>
                    <button class="pbtn" data-p="crystal">Crystal</button>
                </div>
            </div>
            <div class="panel">
                <div class="pt">Coloring</div>
                <div class="cgrid">
                    <button class="cbtn active" data-c="0">Electric</button>
                    <button class="cbtn" data-c="1">Ocean</button>
                    <button class="cbtn" data-c="2">Sunset</button>
                    <button class="cbtn" data-c="3">Grayscale</button>
                </div>
                <div class="slider" style="margin-top:9px">
                    <div class="sl-label"><span>Iterations</span><span id="iterVal">256</span></div>
                    <input type="range" id="iterSlider" min="50" max="2000" value="256" step="10">
                </div>
            </div>
            <div class="panel">
                <div class="pt">Animate</div>
                <button class="btn btn-rec" id="recBtn">Start Zoom Animation</button>
                <div class="slider">
                    <div class="sl-label"><span>Duration (sec)</span><span id="durVal">30</span></div>
                    <input type="range" id="durSlider" min="10" max="180" value="30">
                </div>
                <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
                <div class="ptext" id="ptext">Ready — navigate to a spot then animate</div>
            </div>
        </div>
    </div>

<script>
// ─── WebGL 2 ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false });
if (!gl) {
    document.body.innerHTML = '<div style="color:#f66;padding:30px">WebGL 2 not supported in this version of Electron.</div>';
    throw new Error('no webgl2');
}

const VS = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  u_center;
uniform float u_zoom;
uniform int   u_maxIter;
uniform int   u_scheme;
uniform vec2  u_res;

vec3 cospal(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return clamp(a + b * cos(6.28318530 * (c * t + d)), 0.0, 1.0);
}

vec3 colorize(float t) {
    if (u_scheme == 0)
        return cospal(t, vec3(0.5), vec3(0.5),
                         vec3(1.0,0.7,0.4), vec3(0.00,0.15,0.20));
    if (u_scheme == 1)
        return cospal(t, vec3(0.2,0.4,0.5), vec3(0.2,0.4,0.5),
                         vec3(2.0,1.0,0.8), vec3(0.50,0.20,0.25));
    if (u_scheme == 2)
        return cospal(t, vec3(0.8,0.5,0.4), vec3(0.2,0.4,0.2),
                         vec3(2.0,1.0,1.0), vec3(0.00,0.25,0.25));
    float g = t * t;
    return vec3(g);
}

void main() {
    vec2 uv  = gl_FragCoord.xy / u_res;
    float ar = u_res.x / u_res.y;
    float ry = 3.0 / u_zoom;
    float rx = ry * ar;

    // y_world increases downward (matching original 2D-canvas convention)
    float x = u_center.x + (uv.x - 0.5) * rx;
    float y = u_center.y + (0.5 - uv.y) * ry;

    float zr = 0.0, zi = 0.0, zr2 = 0.0, zi2 = 0.0;
    int iter = 0;
    for (int i = 0; i < u_maxIter; i++) {
        if (zr2 + zi2 > 4.0) break;
        zi  = 2.0 * zr * zi + y;
        zr  = zr2 - zi2 + x;
        zr2 = zr * zr;
        zi2 = zi * zi;
        iter++;
    }

    if (iter == u_maxIter) {
        fragColor = vec4(0.02, 0.02, 0.06, 1.0);
        return;
    }

    // Smooth (continuous) iteration count via bailout smoothing
    float log_zn      = log2(zr2 + zi2) * 0.5;        // log2(|z|)
    float nu           = log2(max(log_zn, 1e-10));     // log2(log2(|z|))
    float smooth_iter  = float(iter) + 1.0 - nu;

    float t = fract(smooth_iter / 40.0);
    fragColor = vec4(colorize(t), 1.0);
}`;

function mkShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(s));
    return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {
    center:  gl.getUniformLocation(prog, 'u_center'),
    zoom:    gl.getUniformLocation(prog, 'u_zoom'),
    maxIter: gl.getUniformLocation(prog, 'u_maxIter'),
    scheme:  gl.getUniformLocation(prog, 'u_scheme'),
    res:     gl.getUniformLocation(prog, 'u_res'),
};

// ─── State ────────────────────────────────────────────────────────────────────
let cx = -0.5, cy = 0, zoom = 1, maxIter = 256, scheme = 0;
let isRec = false, recStart = 0, recDur = 30;
let recTargetCx = -0.5, recTargetCy = 0;
let animId = null;

const PRESETS = {
    spiral:   [-0.7615740, -0.0847596, 60000],
    seahorse: [-0.7450000,  0.1130000, 12000],
    elephant: [ 0.2650000,  0.0010000,  9000],
    valley:   [-0.1528000, -1.0397000,  5000],
    triple:   [-0.0880000,  0.6540000, 12000],
    crystal:  [-1.7680000,  0.0020000,  1200],
};

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
    gl.uniform2f(U.center, cx, cy);
    gl.uniform1f(U.zoom, zoom);
    gl.uniform1i(U.maxIter, maxIter);
    gl.uniform1i(U.scheme, scheme);
    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ─── Canvas resize ────────────────────────────────────────────────────────────
function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth  * dpr);
    const h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width  = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
    }
    render();
}
new ResizeObserver(resizeCanvas).observe(canvas);

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
    const sign = cy >= 0 ? '+' : '';
    document.getElementById('coords').textContent =
        cx.toFixed(7) + sign + cy.toFixed(7) + 'i';
    const z = zoom;
    let s;
    if      (z >= 1e12) s = (z/1e12).toFixed(1)+'T';
    else if (z >= 1e9)  s = (z/1e9 ).toFixed(1)+'B';
    else if (z >= 1e6)  s = (z/1e6 ).toFixed(1)+'M';
    else if (z >= 1e3)  s = (z/1e3 ).toFixed(1)+'K';
    else                s = z.toFixed(1)+'x';
    document.getElementById('zoomInfo').textContent = s;
}

// ─── View helpers ─────────────────────────────────────────────────────────────
function viewSize() {
    const ar = canvas.width / Math.max(canvas.height, 1);
    const ry = 3 / zoom, rx = ry * ar;
    return { rx, ry };
}

function goPreset(name) {
    stopRec();
    const p = PRESETS[name];
    if (!p) return;
    [cx, cy, zoom] = p;
    updateHUD(); render();
}

function reset() {
    stopRec();
    cx = -0.5; cy = 0; zoom = 1;
    updateHUD(); render();
}

// ─── Mouse ────────────────────────────────────────────────────────────────────
let drag = false;
canvas.addEventListener('mousedown', () => { drag = true; });
window.addEventListener('mouseup',   () => { drag = false; });

canvas.addEventListener('mousemove', e => {
    if (!drag || isRec) return;
    const { rx, ry } = viewSize();
    cx -= (e.movementX / canvas.clientWidth)  * rx;
    cy -= (e.movementY / canvas.clientHeight) * ry;
    updateHUD(); render();
});

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (isRec) return;
    const zf = e.deltaY > 0 ? 1 / 1.15 : 1.15;
    const { rx, ry } = viewSize();

    const cssW = canvas.clientWidth;
    const cssH = canvas.clientHeight;
    const mx = e.offsetX / cssW;   // 0..1 from left
    const my = e.offsetY / cssH;   // 0..1 from top

    // World point under cursor
    const wx = cx + (mx - 0.5) * rx;
    const wy = cy + (my - 0.5) * ry;

    zoom = Math.max(1, zoom * zf);
    const { rx: rx2, ry: ry2 } = viewSize();

    // Keep world point stationary under cursor
    cx = wx - (mx - 0.5) * rx2;
    cy = wy - (my - 0.5) * ry2;

    updateHUD(); render();
}, { passive: false });

// ─── Fullscreen ───────────────────────────────────────────────────────────────
let fsMode = false;
function toggleFS() {
    fsMode = !fsMode;
    document.body.classList.toggle('fs', fsMode);
    document.getElementById('fsBtn').textContent =
        fsMode ? 'Exit Fullscreen  [F]' : 'Fullscreen  [F]';
    document.getElementById('fsHint').style.display = fsMode ? 'block' : 'none';
    setTimeout(resizeCanvas, 30);
}
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'Escape' && fsMode)   toggleFS();
});
document.getElementById('fsBtn').onclick = toggleFS;

// ─── Animation ────────────────────────────────────────────────────────────────
function fmtTime(s) {
    return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

function startRec() {
    stopRec();
    recTargetCx = cx;
    recTargetCy = cy;
    zoom = 1;
    recStart = performance.now();
    isRec = true;
    document.getElementById('recBtn').textContent = 'Stop Animation';
    document.getElementById('recBtn').classList.add('active');
    updateHUD();
    animLoop();
}

function stopRec() {
    isRec = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    document.getElementById('recBtn').textContent = 'Start Zoom Animation';
    document.getElementById('recBtn').classList.remove('active');
    document.getElementById('pbar').style.width = '0%';
    document.getElementById('ptext').textContent = 'Ready — navigate to a spot then animate';
}

function animLoop() {
    if (!isRec) return;
    const elapsed = (performance.now() - recStart) / 1000;
    const prog  = Math.min(elapsed / recDur, 1);
    const eased = prog * prog * prog;

    zoom = Math.pow(1e10, eased);
    cx   = recTargetCx;
    cy   = recTargetCy;

    document.getElementById('pbar').style.width = (prog * 100) + '%';
    document.getElementById('ptext').textContent = fmtTime(elapsed) + ' / ' + fmtTime(recDur);
    updateHUD(); render();

    if (prog >= 1) {
        isRec = false;
        animId = null;
        document.getElementById('recBtn').textContent = 'Start Zoom Animation';
        document.getElementById('recBtn').classList.remove('active');
        document.getElementById('ptext').textContent = 'Done';
        return;
    }
    animId = requestAnimationFrame(animLoop);
}

// ─── UI wiring ────────────────────────────────────────────────────────────────
document.getElementById('ziBtn').onclick  = () => { stopRec(); zoom = Math.max(1, zoom * 1.5); updateHUD(); render(); };
document.getElementById('zoBtn').onclick  = () => { stopRec(); zoom = Math.max(1, zoom / 1.5); updateHUD(); render(); };
document.getElementById('rstBtn').onclick = () => reset();
document.getElementById('recBtn').onclick = () => isRec ? stopRec() : startRec();

document.querySelectorAll('.pbtn').forEach(b =>
    b.addEventListener('click', () => goPreset(b.dataset.p)));

document.querySelectorAll('.cbtn').forEach(b =>
    b.addEventListener('click', () => {
        scheme = parseInt(b.dataset.c);
        document.querySelectorAll('.cbtn').forEach(x =>
            x.classList.toggle('active', parseInt(x.dataset.c) === scheme));
        render();
    }));

document.getElementById('iterSlider').addEventListener('input', function () {
    maxIter = parseInt(this.value);
    document.getElementById('iterVal').textContent = maxIter;
    render();
});
document.getElementById('durSlider').addEventListener('input', function () {
    recDur = parseInt(this.value);
    document.getElementById('durVal').textContent = recDur;
});

// ─── Electron ─────────────────────────────────────────────────────────────────
if (window.electronAPI) {
    window.electronAPI.getAppVersion()
        .then(v => document.getElementById('ver').textContent = 'v' + v)
        .catch(() => {});
    window.electronAPI.onUpdateStatus(() => {});
} else {
    document.getElementById('ver').textContent = 'Browser';
}

// ─── Init ─────────────────────────────────────────────────────────────────────
updateHUD();
</script>
</body>
</html>
