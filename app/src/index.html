<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status { font-size: 0.7rem; color: #888; }
        .main { display: flex; gap: 14px; flex: 1; max-width: 1400px; }
        .canvas-wrap { border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(102,126,234,0.25); }
        canvas { display: block; background: #000; cursor: crosshair; }
        .sidebar { display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
        .panel { background: #1a1a2e; border-radius: 10px; padding: 12px; }
        .panel-title { font-size: 0.75rem; font-weight: 600; color: #667eea; margin-bottom: 8px; text-transform: uppercase; }
        .btn { width: 100%; padding: 9px 12px; font-size: 0.8rem; border: none; border-radius: 6px; cursor: pointer; transition: all 0.15s; font-weight: 500; margin-bottom: 5px; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-secondary { background: #252540; color: #fff; }
        .btn-secondary:hover { background: #2d2d50; }
        .btn-recording { background: #dc3545; color: #fff; }
        .btn-recording.active { background: #28a745; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .slider { margin-bottom: 8px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.7rem; color: #aaa; margin-bottom: 3px; }
        input[type=range] { width: 100%; height: 5px; border-radius: 3px; background: #252540; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #667eea; cursor: pointer; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .color-btn { padding: 7px 5px; font-size: 0.7rem; border: 1px solid #333; border-radius: 5px; background: #252540; color: #fff; cursor: pointer; transition: all 0.15s; }
        .color-btn:hover { background: #2d2d50; }
        .color-btn.active { border-color: #667eea; background: #2d2d50; }
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .preset-btn { padding: 7px 5px; font-size: 0.65rem; border: 1px solid #333; border-radius: 5px; background: #252540; color: #ccc; cursor: pointer; }
        .preset-btn:hover { background: #2d2d50; color: #fff; }
        .progress { width: 100%; height: 3px; background: #252540; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.05s; }
        .progress-text { font-size: 0.65rem; color: #888; margin-top: 3px; }
        .info { font-size: 0.65rem; color: #666; margin-top: 6px; text-align: center; }
        .info span { color: #667eea; }
        .update-status { font-size: 0.65rem; padding: 4px 10px; background: #1a1a2e; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mandelbrot Visualizer</h1>
        <span class="update-status" id="updateStatus">Loading...</span>
    </div>

    <div class="main">
        <div class="canvas-wrap">
            <canvas id="canvas" width="700" height="600"></canvas>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">Video Mode</div>
                <button class="btn btn-recording" id="recordBtn">Start Recording</button>
                <div class="slider">
                    <div class="slider-label"><span>Duration (sec)</span><span id="durVal">30</span></div>
                    <input type="range" id="duration" min="10" max="180" value="30">
                </div>
                <div class="slider">
                    <div class="slider-label"><span>Speed</span><span id="speedVal">1.0x</span></div>
                    <input type="range" id="speed" min="0.5" max="5" value="1" step="0.1">
                </div>
                <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
                <div class="progress-text" id="progressText">Ready</div>
            </div>

            <div class="panel">
                <div class="panel-title">Navigation</div>
                <button class="btn btn-secondary" id="zoomInBtn">Zoom In</button>
                <button class="btn btn-secondary" id="zoomOutBtn">Zoom Out</button>
                <button class="btn btn-secondary" id="resetBtn">Reset View</button>
                <div class="panel-title" style="margin-top:10px">Presets</div>
                <div class="preset-grid">
                    <button class="preset-btn" data-p="spiral">Spiral</button>
                    <button class="preset-btn" data-p="seahorse">Seahorse</button>
                    <button class="preset-btn" data-p="elephant">Elephant</button>
                    <button class="preset-btn" data-p="bug">Buggy</button>
                    <button class="preset-btn" data-p="triple">Triple</button>
                    <button class="preset-btn" data-p="crystal">Crystal</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Coloring</div>
                <div class="color-grid">
                    <button class="color-btn active" data-c="0">Electric</button>
                    <button class="color-btn" data-c="1">Ocean</button>
                    <button class="color-btn" data-c="2">Sunset</button>
                    <button class="color-btn" data-c="3">Gray</button>
                </div>
                <div class="slider" style="margin-top:8px">
                    <div class="slider-label"><span>Iterations</span><span id="iterVal">256</span></div>
                    <input type="range" id="iterations" min="50" max="2000" value="256" step="10">
                </div>
            </div>
        </div>
    </div>

    <div class="info"><span id="coords">-0.5 + 0i</span> | <span id="zoom">1x</span></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const palettes = [
            [[0,80,130,20,200,255,255,255],[0,20,200,255,50,100,0,255],[0,255,255,50,0,0,0,255]],
            [[0,0,0,0,100,102,255],[0,26,51,102,153,204,255],[51,77,102,153,204,255,255]],
            [[13,45,92,143,194,242,255,255],[2,27,61,93,125,160,214,255],[33,78,122,166,189,208,231,245]],
            [[0,26,51,77,102,128,153,179,204,230,255],[0,26,51,77,102,128,153,179,204,230,255],[0,26,51,77,102,128,153,179,204,230,255]]
        ];

        const presets = {
            spiral: [-0.761574, -0.0847596, 50000],
            seahorse: [-0.745, 0.113, 10000],
            elephant: [0.265, 0.001, 8000],
            bug: [-1.15, 0.28, 5000],
            triple: [-0.088, 0.654, 10000],
            crystal: [-1.768, 0.002, 1000]
        };

        let cx = -0.5, cy = 0, zoom = 1, maxIter = 256, scheme = 0;
        let isRec = false, recStart = 0, recDur = 30, recSpeed = 1, frame = 0;
        let imageData = ctx.createImageData(W, H);

        function getColor(iter) {
            if (iter === maxIter) return [5, 5, 15];
            const p = palettes[scheme];
            const t = (iter % 100) / 100 * (p[0].length - 1);
            const i = t | 0, f = t - i;
            const r = p[0], g = p[1], b = p[2];
            return [
                (r[i] + f * (r[i+1] - r[i]) + 0.5) | 0,
                (g[i] + f * (g[i+1] - g[i]) + 0.5) | 0,
                (b[i] + f * (b[i+1] - b[i]) + 0.5) | 0
            ];
        }

        function render() {
            const ar = W / H, ry = 3 / zoom, rx = ry * ar;
            const x0 = cx - rx / 2, y0 = cy - ry / 2;
            const dx = rx / W, dy = ry / H;
            const d = imageData.data;

            for (let py = 0; py < H; py++) {
                const y = y0 + py * dy;
                for (let px = 0; px < W; px++) {
                    const x = x0 + px * dx;
                    let zr = 0, zi = 0, zr2 = 0, zi2 = 0, iter = 0;
                    while (zr2 + zi2 <= 4 && iter < maxIter) {
                        zi = 2 * zr * zi + y;
                        zr = zr2 - zi2 + x;
                        zr2 = zr * zr; zi2 = zi * zi;
                        iter++;
                    }
                    const [r, g, b] = getColor(iter);
                    const idx = (py * W + px) * 4;
                    d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function updateCoords() {
            document.getElementById('coords').textContent = cx.toFixed(6) + (cy >= 0 ? '+' : '') + cy.toFixed(6) + 'i';
            const z = zoom;
            let zStr;
            if (z >= 1e12) zStr = (z/1e12).toFixed(1) + 'T';
            else if (z >= 1e9) zStr = (z/1e9).toFixed(1) + 'B';
            else if (z >= 1e6) zStr = (z/1e6).toFixed(1) + 'M';
            else if (z >= 1e3) zStr = (z/1e3).toFixed(1) + 'K';
            else zStr = z.toFixed(1) + 'x';
            document.getElementById('zoom').textContent = zStr;
        }

        function zoomIn() { stopRec(); zoom *= 1.5; updateCoords(); render(); }
        function zoomOut() { stopRec(); zoom = Math.max(1, zoom / 1.5); updateCoords(); render(); }
        function reset() { stopRec(); cx = -0.5; cy = 0; zoom = 1; updateCoords(); render(); }
        function goPreset(n) { stopRec(); const p = presets[n]; if (p) { cx = p[0]; cy = p[1]; zoom = p[2]; updateCoords(); render(); } }
        function setScheme(i) { scheme = i; document.querySelectorAll('.color-btn').forEach((b, j) => b.classList.toggle('active', j === i)); render(); }

        function startRec() {
            isRec = true; recStart = Date.now(); frame = 0; cx = -0.5; cy = 0; zoom = 1;
            document.getElementById('recordBtn').textContent = 'Stop Recording';
            document.getElementById('recordBtn').classList.add('active');
            updateCoords(); render(); recLoop();
        }

        function stopRec() {
            isRec = false;
            document.getElementById('recordBtn').textContent = 'Start Recording';
            document.getElementById('recordBtn').classList.remove('active');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').textContent = 'Ready';
        }

        function recLoop() {
            if (!isRec) return;
            const t = (Date.now() - recStart) / 1000;
            const prog = Math.min(t / recDur, 1);
            document.getElementById('progressBar').style.width = (prog * 100) + '%';
            document.getElementById('progressText').textContent = fmtTime(t) + ' / ' + fmtTime(recDur) + ' | Frame ' + frame;
            zoom = Math.pow(1e12, prog * prog * prog);
            updateCoords(); render(); frame++;
            if (t >= recDur) { stopRec(); document.getElementById('progressText').textContent = 'Done! ' + frame + ' frames'; return; }
            setTimeout(recLoop, 30);
        }

        function fmtTime(s) { return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }

        document.getElementById('zoomInBtn').onclick = zoomIn;
        document.getElementById('zoomOutBtn').onclick = zoomOut;
        document.getElementById('resetBtn').onclick = reset;
        document.getElementById('recordBtn').onclick = () => isRec ? stopRec() : startRec();

        document.querySelectorAll('.color-btn').forEach(b => b.onclick = () => setScheme(parseInt(b.dataset.c)));
        document.querySelectorAll('.preset-btn').forEach(b => b.onclick = () => goPreset(b.dataset.p));

        document.getElementById('iterations').oninput = function() {
            maxIter = parseInt(this.value);
            document.getElementById('iterVal').textContent = maxIter;
            render();
        };
        document.getElementById('duration').oninput = function() { recDur = parseInt(this.value); document.getElementById('durVal').textContent = recDur; };
        document.getElementById('speed').oninput = function() { recSpeed = parseFloat(this.value); document.getElementById('speedVal').textContent = recSpeed.toFixed(1) + 'x'; };

        let drag = false, lastX, lastY;
        canvas.onmousedown = e => { drag = true; lastX = e.clientX; lastY = e.clientY; };
        canvas.onmousemove = e => {
            if (!drag || isRec) return;
            const ar = W / H, ry = 3 / zoom, rx = ry * ar;
            cx -= ((e.clientX - lastX) / W) * rx;
            cy -= ((e.clientY - lastY) / H) * ry;
            lastX = e.clientX; lastY = e.clientY;
            updateCoords(); render();
        };
        canvas.onmouseup = canvas.onmouseleave = () => drag = false;

        canvas.onwheel = e => {
            e.preventDefault();
            if (isRec) return;
            const zf = e.deltaY > 0 ? 0.9 : 1.1;
            const ar = W / H, ry = 3 / zoom, rx = ry * ar;
            const mx = e.offsetX, my = e.offsetY;
            const x0 = cx - rx/2 + (mx/W)*rx, y0 = cy - ry/2 + (my/H)*ry;
            zoom *= zf;
            const ry2 = 3/zoom, rx2 = ry2 * ar;
            cx = x0 + (mx/W)*rx2 - rx2/2;
            cy = y0 + (my/H)*ry2 - ry2/2;
            updateCoords(); render();
        };

        updateCoords(); render();

        // Update status
        if (window.electronAPI) {
            window.electronAPI.onUpdateStatus(d => console.log('Update:', d));
            window.electronAPI.getAppVersion().then(v => document.getElementById('updateStatus').textContent = 'v' + v);
        } else {
            document.getElementById('updateStatus').textContent = 'Desktop app';
        }
    </script>
</body>
</html>
