<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mandelbrot Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #0a0a0f; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 7px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.35rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ver-pill {
            font-size: 0.68rem;
            color: #888;
            background: #1a1a2e;
            padding: 3px 10px;
            border-radius: 12px;
        }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 10px;
            padding: 0 10px 10px;
        }
        .canvas-wrap {
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 36px rgba(102,126,234,0.22);
            position: relative;
            min-width: 0;
        }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        .overlay {
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-size: 0.63rem;
            color: #777;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 4px;
        }
        .overlay span { color: #667eea; }
        .fs-hint {
            position: absolute;
            top: 8px; right: 10px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.28);
            pointer-events: none;
            display: none;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 198px;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .panel { background: #1a1a2e; border-radius: 10px; padding: 12px; }
        .pt {
            font-size: 0.72rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .btn {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.78rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.12s, background 0.12s;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .btn:last-child { margin-bottom: 0; }
        .btn:hover { transform: translateY(-1px); }
        .btn-sec { background: #252540; color: #ccc; }
        .btn-sec:hover { background: #2d2d50; color: #fff; }
        .btn-rec { background: #b02020; color: #fff; }
        .btn-rec.active { background: #228b22; }
        .slider { margin-bottom: 8px; }
        .sl-label { display: flex; justify-content: space-between; font-size: 0.68rem; color: #aaa; margin-bottom: 3px; }
        input[type=range] {
            width: 100%; height: 4px; border-radius: 2px;
            background: #252540; outline: none; -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 13px; height: 13px;
            border-radius: 50%; background: #667eea; cursor: pointer;
        }
        .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .cbtn {
            padding: 6px 4px; font-size: 0.68rem;
            border: 1px solid #333; border-radius: 5px;
            background: #252540; color: #bbb; cursor: pointer;
        }
        .cbtn:hover { background: #2d2d50; color: #fff; }
        .cbtn.active { border-color: #667eea; background: #2d2d50; color: #fff; }
        .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .pbtn {
            padding: 6px 4px; font-size: 0.63rem;
            border: 1px solid #2a2a44; border-radius: 5px;
            background: #1e1e38; color: #bbb; cursor: pointer;
        }
        .pbtn:hover { background: #2d2d50; color: #fff; }
        .pbar-wrap { width: 100%; height: 3px; background: #252540; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .pbar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.05s; }
        .ptext { font-size: 0.63rem; color: #777; margin-top: 3px; }

        body.fs .header,
        body.fs .sidebar { display: none; }
        body.fs .main { padding: 0; }
        body.fs .canvas-wrap { border-radius: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mandelbrot Visualizer</h1>
        <span class="ver-pill" id="ver">Loading...</span>
    </div>
    <div class="main">
        <div class="canvas-wrap">
            <canvas id="c"></canvas>
            <div class="overlay"><span id="coords">-0.5 + 0i</span> &nbsp;|&nbsp; <span id="zoomInfo">1x</span> &nbsp;|&nbsp; iter: <span id="iterInfo">-</span></div>
            <div class="fs-hint" id="fsHint">Press F or Esc to exit fullscreen</div>
        </div>
        <div class="sidebar">
            <div class="panel">
                <div class="pt">View</div>
                <button class="btn btn-sec" id="fsBtn">Fullscreen  [F]</button>
                <button class="btn btn-sec" id="ziBtn">Zoom In</button>
                <button class="btn btn-sec" id="zoBtn">Zoom Out</button>
                <button class="btn btn-sec" id="rstBtn">Reset</button>
            </div>
            <div class="panel">
                <div class="pt">Presets</div>
                <div class="pgrid">
                    <button class="pbtn" data-p="spiral">Spiral</button>
                    <button class="pbtn" data-p="seahorse">Seahorse</button>
                    <button class="pbtn" data-p="elephant">Elephant</button>
                    <button class="pbtn" data-p="valley">Valley</button>
                    <button class="pbtn" data-p="triple">Triple</button>
                    <button class="pbtn" data-p="crystal">Crystal</button>
                </div>
            </div>
            <div class="panel">
                <div class="pt">Coloring</div>
                <div class="cgrid">
                    <button class="cbtn active" data-c="0">Electric</button>
                    <button class="cbtn" data-c="1">Ocean</button>
                    <button class="cbtn" data-c="2">Sunset</button>
                    <button class="cbtn" data-c="3">Grayscale</button>
                </div>
                <div class="slider" style="margin-top:9px">
                    <div class="sl-label"><span>Max iterations</span><span id="iterVal">8000</span></div>
                    <input type="range" id="iterSlider" min="500" max="20000" value="8000" step="500">
                </div>
            </div>
            <div class="panel">
                <div class="pt">Animate</div>
                <button class="btn btn-rec" id="recBtn">Start Zoom Animation</button>
                <div class="slider">
                    <div class="sl-label"><span>Duration (sec)</span><span id="durVal">30</span></div>
                    <input type="range" id="durSlider" min="10" max="180" value="30">
                </div>
                <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
                <div class="ptext" id="ptext">Ready — each press zooms a different location</div>
            </div>
        </div>
    </div>

<script>
// NOTE: ALL strings passed to WebGL/GLSL must be ASCII only.
// Non-ASCII characters (even in comments) can crash shader compilation on some drivers.

var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl2', { antialias: false });

if (!gl) {
    document.getElementById('ver').textContent = 'No WebGL2';
    throw new Error('WebGL2 not available');
}

// Vertex shader: fullscreen quad
var VS = '#version 300 es\n' +
    'in vec2 a_pos;\n' +
    'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }\n';

// Fragment shader: Mandelbrot with double-float arithmetic (Veltkamp splitting).
// All comments are ASCII. No Unicode characters anywhere in this string.
var FS = '#version 300 es\n' +
    'precision highp float;\n' +
    'out vec4 fragColor;\n' +
    'uniform vec2  u_cx;\n' +   // center.x as (hi, lo) double-float
    'uniform vec2  u_cy;\n' +   // center.y as (hi, lo) double-float
    'uniform float u_zoom;\n' +
    'uniform int   u_maxIter;\n' +
    'uniform int   u_scheme;\n' +
    'uniform vec2  u_res;\n' +

    // TwoSum: exact split of a+b into (sum, error term)
    'vec2 twosum(float a, float b) {\n' +
    '    float s = a + b;\n' +
    '    float v = s - a;\n' +
    '    return vec2(s, (a - (s - v)) + (b - v));\n' +
    '}\n' +

    // TwoProduct via Veltkamp splitting (S=4097 = 2^12+1 for 23-bit mantissa).
    // Splits each operand into 12+11 bit halves so hi*hi fits exactly in float32.
    'vec2 twoprod(float a, float b) {\n' +
    '    float s  = 4097.0 * a;\n' +
    '    float ah = s - (s - a);\n' +
    '    float al = a - ah;\n' +
    '    s        = 4097.0 * b;\n' +
    '    float bh = s - (s - b);\n' +
    '    float bl = b - bh;\n' +
    '    float p  = a * b;\n' +
    '    return vec2(p, ((ah * bh - p) + ah * bl + al * bh) + al * bl);\n' +
    '}\n' +

    'vec2 df_add(vec2 a, vec2 b) {\n' +
    '    vec2 r = twosum(a.x, b.x);\n' +
    '    r.y += a.y + b.y;\n' +
    '    return twosum(r.x, r.y);\n' +
    '}\n' +
    'vec2 df_sub(vec2 a, vec2 b) {\n' +
    '    return df_add(a, vec2(-b.x, -b.y));\n' +
    '}\n' +
    'vec2 df_mul(vec2 a, vec2 b) {\n' +
    '    vec2 p = twoprod(a.x, b.x);\n' +
    '    p.y   += a.x * b.y + a.y * b.x;\n' +
    '    return twosum(p.x, p.y);\n' +
    '}\n' +
    // Multiply by 2 is exact (shifts exponent, no rounding)
    'vec2 df_x2(vec2 a) { return vec2(a.x * 2.0, a.y * 2.0); }\n' +

    // Cosine color palette
    'vec3 cospal(float t, vec3 a, vec3 b, vec3 c, vec3 d) {\n' +
    '    return clamp(a + b * cos(6.28318530 * (c * t + d)), 0.0, 1.0);\n' +
    '}\n' +
    'vec3 colorize(float t) {\n' +
    '    if (u_scheme == 0)\n' +
    '        return cospal(t, vec3(0.5), vec3(0.5),\n' +
    '                      vec3(1.0,0.7,0.4), vec3(0.00,0.15,0.20));\n' +
    '    if (u_scheme == 1)\n' +
    '        return cospal(t, vec3(0.2,0.4,0.5), vec3(0.2,0.4,0.5),\n' +
    '                      vec3(2.0,1.0,0.8), vec3(0.50,0.20,0.25));\n' +
    '    if (u_scheme == 2)\n' +
    '        return cospal(t, vec3(0.8,0.5,0.4), vec3(0.2,0.4,0.2),\n' +
    '                      vec3(2.0,1.0,1.0), vec3(0.00,0.25,0.25));\n' +
    '    return vec3(t * t);\n' +
    '}\n' +

    'void main() {\n' +
    '    vec2  uv = gl_FragCoord.xy / u_res;\n' +
    '    float ar = u_res.x / u_res.y;\n' +
    '    float ry = 3.0 / u_zoom;\n' +
    '    float rx = ry * ar;\n' +

    // Compute c = center + per-pixel offset in double-float.
    // This gives sub-float32 per-pixel differences needed for deep zooms.
    '    vec2 cx = df_add(u_cx, vec2((uv.x - 0.5) * rx, 0.0));\n' +
    '    vec2 cy = df_add(u_cy, vec2((0.5 - uv.y) * ry, 0.0));\n' +

    // Full double-float Mandelbrot iteration
    '    vec2 zr = vec2(0.0);\n' +
    '    vec2 zi = vec2(0.0);\n' +
    '    float esc = 0.0;\n' +
    '    int iter = 0;\n' +
    '    for (int i = 0; i < u_maxIter; i++) {\n' +
    '        vec2 zr2 = df_mul(zr, zr);\n' +
    '        vec2 zi2 = df_mul(zi, zi);\n' +
    '        esc = zr2.x + zi2.x;\n' +
    '        if (esc > 4.0) break;\n' +
    '        vec2 nzi = df_add(df_x2(df_mul(zr, zi)), cy);\n' +
    '        vec2 nzr = df_add(df_sub(zr2, zi2), cx);\n' +
    '        zr = nzr; zi = nzi;\n' +
    '        iter++;\n' +
    '    }\n' +

    '    if (iter == u_maxIter) {\n' +
    '        fragColor = vec4(0.02, 0.02, 0.06, 1.0);\n' +
    '        return;\n' +
    '    }\n' +
    '    float log_zn = log2(esc) * 0.5;\n' +
    '    float nu     = log2(max(log_zn, 1e-10));\n' +
    '    float si     = float(iter) + 1.0 - nu;\n' +
    '    float t      = fract(si / 40.0);\n' +
    '    fragColor = vec4(colorize(t), 1.0);\n' +
    '}\n';

function mkShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        var err = gl.getShaderInfoLog(s);
        console.error('Shader compile error:', err);
        document.getElementById('ver').textContent = 'Shader Error';
        throw new Error(err);
    }
    return s;
}

var prog;
try {
    prog = gl.createProgram();
    gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
    }
    gl.useProgram(prog);
} catch(e) {
    console.error('WebGL program error:', e);
    document.getElementById('ver').textContent = 'GL Error';
    throw e;
}

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var U = {
    cx:      gl.getUniformLocation(prog, 'u_cx'),
    cy:      gl.getUniformLocation(prog, 'u_cy'),
    zoom:    gl.getUniformLocation(prog, 'u_zoom'),
    maxIter: gl.getUniformLocation(prog, 'u_maxIter'),
    scheme:  gl.getUniformLocation(prog, 'u_scheme'),
    res:     gl.getUniformLocation(prog, 'u_res'),
};

// Split a JS double into float32 hi+lo so the shader can recover full precision
function splitDouble(x) {
    var hi = Math.fround(x);
    return [hi, x - hi];
}

// --- State -------------------------------------------------------------------
var cx = -0.5, cy = 0, zoom = 1, scheme = 0;
var isRec = false, recStart = 0, recDur = 30;
var animId = null, animTargetIdx = 0;

// Progressive rendering state
var PROG_INITIAL = 150;   // iter count used for instant display during interaction
var PROG_MAX     = 8000;  // effectively infinite -- keep refining to this depth
var progIter     = PROG_INITIAL;
var progTimer    = null;

// Preset views: [cx, cy, zoom]  -- all on the Mandelbrot boundary
var PRESETS = {
    spiral:   [-0.7615740,  -0.0847596,  60000],
    seahorse: [-0.7436449,   0.1318256,  12000],
    elephant: [ 0.3750010,   0.0000010,   9000],
    valley:   [-0.1528000,  -1.0397000,   5000],
    triple:   [-0.0883499,   0.6540067,  12000],
    crystal:  [-1.7691104,   0.0042368,   1200],
};

// Curated deep-zoom targets on the Mandelbrot boundary (filament / boundary points)
var ANIM_TARGETS = [
    { cx: -0.7436448926608224, cy:  0.13182563972975655 },  // seahorse valley
    { cx: -0.0883499135516001, cy:  0.65400672006740000 },  // triple spiral
    { cx: -0.7615740000000000, cy: -0.08475960000000000 },  // double spiral arm
    { cx: -1.7691103755551340, cy:  0.00423684791873677 },  // antenna tip
];

// --- Render ------------------------------------------------------------------
function render(iter) {
    var cxs = splitDouble(cx);
    var cys = splitDouble(cy);
    gl.uniform2f(U.cx, cxs[0], cxs[1]);
    gl.uniform2f(U.cy, cys[0], cys[1]);
    gl.uniform1f(U.zoom, zoom);
    gl.uniform1i(U.maxIter, iter);
    gl.uniform1i(U.scheme, scheme);
    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Auto-scale iterations for animation so boundary detail stays visible.
// ~100 * log10(zoom) is the empirical minimum; capped at 1500.
function autoIter(z) {
    var logz = Math.log10(Math.max(z, 1));
    return Math.min(1500, Math.max(200, Math.round(100 * logz + 200)));
}

// --- Progressive rendering ---------------------------------------------------
// After every view change: render immediately at PROG_INITIAL (fast), then
// automatically double iterations every ~120ms until PROG_MAX is reached.

function stopProgressive() {
    if (progTimer !== null) { clearTimeout(progTimer); progTimer = null; }
}

function scheduleNextStep() {
    stopProgressive();
    if (progIter >= PROG_MAX || isRec) return;
    progTimer = setTimeout(function() {
        progTimer = null;
        if (isRec) return;
        progIter = Math.min(PROG_MAX, progIter * 2);
        render(progIter);
        document.getElementById('iterInfo').textContent = progIter;
        scheduleNextStep();
    }, 120);
}

// Call after any view change (pan, zoom, preset, color).
// Re-renders at low quality immediately and starts the refinement chain.
function afterViewChange() {
    stopProgressive();
    progIter = PROG_INITIAL;
    render(progIter);
    document.getElementById('iterInfo').textContent = progIter;
    scheduleNextStep();
}

// --- Canvas resize -----------------------------------------------------------
function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(canvas.clientWidth  * dpr);
    var h = Math.round(canvas.clientHeight * dpr);
    if (w < 1) w = 1;
    if (h < 1) h = 1;
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width  = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
    }
    afterViewChange();
}
new ResizeObserver(resizeCanvas).observe(canvas);

// --- HUD ---------------------------------------------------------------------
function updateHUD() {
    var sign = cy >= 0 ? '+' : '';
    document.getElementById('coords').textContent =
        cx.toFixed(7) + sign + cy.toFixed(7) + 'i';
    var z = zoom, s;
    if      (z >= 1e12) s = (z/1e12).toFixed(1)+'T';
    else if (z >= 1e9)  s = (z/1e9 ).toFixed(1)+'B';
    else if (z >= 1e6)  s = (z/1e6 ).toFixed(1)+'M';
    else if (z >= 1e3)  s = (z/1e3 ).toFixed(1)+'K';
    else                s = z.toFixed(1)+'x';
    document.getElementById('zoomInfo').textContent = s;
    document.getElementById('iterInfo').textContent = progIter;
}

// --- View helpers ------------------------------------------------------------
function viewSize() {
    var ar = canvas.width / Math.max(canvas.height, 1);
    var ry = 3 / zoom, rx = ry * ar;
    return { rx: rx, ry: ry };
}

function goPreset(name) {
    stopRec();
    var p = PRESETS[name];
    if (!p) return;
    cx = p[0]; cy = p[1]; zoom = p[2];
    updateHUD(); afterViewChange();
}

function reset() {
    stopRec();
    cx = -0.5; cy = 0; zoom = 1;
    updateHUD(); afterViewChange();
}

// --- Mouse -------------------------------------------------------------------
var drag = false;
canvas.addEventListener('mousedown', function() { drag = true; stopProgressive(); });
window.addEventListener('mouseup', function() {
    if (drag) { drag = false; afterViewChange(); }
    else { drag = false; }
});

canvas.addEventListener('mousemove', function(e) {
    if (!drag || isRec) return;
    var v = viewSize();
    cx -= (e.movementX / canvas.clientWidth)  * v.rx;
    cy -= (e.movementY / canvas.clientHeight) * v.ry;
    // During active drag: render at low quality for responsiveness
    progIter = PROG_INITIAL;
    render(progIter);
    updateHUD();
});

canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (isRec) return;
    var zf = e.deltaY > 0 ? 1 / 1.15 : 1.15;
    var v  = viewSize();
    var cssW = canvas.clientWidth;
    var cssH = canvas.clientHeight;
    var mx = e.offsetX / cssW;
    var my = e.offsetY / cssH;
    var wx = cx + (mx - 0.5) * v.rx;
    var wy = cy + (my - 0.5) * v.ry;
    zoom = Math.max(1, zoom * zf);
    var v2 = viewSize();
    cx = wx - (mx - 0.5) * v2.rx;
    cy = wy - (my - 0.5) * v2.ry;
    updateHUD(); afterViewChange();
}, { passive: false });

// --- Fullscreen --------------------------------------------------------------
var fsMode = false;
function toggleFS() {
    fsMode = !fsMode;
    document.body.classList.toggle('fs', fsMode);
    document.getElementById('fsBtn').textContent =
        fsMode ? 'Exit Fullscreen  [F]' : 'Fullscreen  [F]';
    document.getElementById('fsHint').style.display = fsMode ? 'block' : 'none';
    setTimeout(resizeCanvas, 30);
}
document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'Escape' && fsMode)   toggleFS();
});
document.getElementById('fsBtn').onclick = toggleFS;

// --- Animation ---------------------------------------------------------------
function fmtTime(s) {
    return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

function startRec() {
    stopProgressive();
    isRec = false;
    if (animId !== null) { cancelAnimationFrame(animId); animId = null; }
    var target = ANIM_TARGETS[animTargetIdx % ANIM_TARGETS.length];
    animTargetIdx++;
    // Navigate to this target and zoom from scratch
    cx   = target.cx;
    cy   = target.cy;
    zoom = 1;
    recStart = performance.now();
    isRec = true;
    document.getElementById('recBtn').textContent = 'Stop Animation';
    document.getElementById('recBtn').classList.add('active');
    updateHUD();
    animLoop();
}

function stopRec() {
    isRec = false;
    if (animId !== null) { cancelAnimationFrame(animId); animId = null; }
    document.getElementById('recBtn').textContent = 'Start Zoom Animation';
    document.getElementById('recBtn').classList.remove('active');
    document.getElementById('pbar').style.width = '0%';
    document.getElementById('ptext').textContent = 'Ready — each press zooms a different location';
    // Resume progressive refinement at current view
    afterViewChange();
}

function animLoop() {
    if (!isRec) return;
    var elapsed = (performance.now() - recStart) / 1000;
    var prog    = Math.min(elapsed / recDur, 1);

    // Linear in log-zoom space = constant zoom rate, exactly like YouTube deep-zoom videos.
    // Max 1e11: that is the safe limit for our double-float precision (~15 sig. digits).
    // Zooming past that produces blocking artefacts regardless of iteration count.
    zoom = Math.pow(1e11, prog);

    document.getElementById('pbar').style.width = (prog * 100).toFixed(1) + '%';
    document.getElementById('ptext').textContent = fmtTime(elapsed) + ' / ' + fmtTime(recDur);
    updateHUD();
    render(autoIter(zoom));

    if (prog >= 1) {
        document.getElementById('ptext').textContent = 'Done — press again for next location';
        stopRec();  // also calls afterViewChange to refine the final frame
        return;
    }
    animId = requestAnimationFrame(animLoop);
}

// --- UI wiring ---------------------------------------------------------------
document.getElementById('ziBtn').onclick  = function() { stopRec(); zoom = Math.max(1, zoom*1.5); updateHUD(); afterViewChange(); };
document.getElementById('zoBtn').onclick  = function() { stopRec(); zoom = Math.max(1, zoom/1.5); updateHUD(); afterViewChange(); };
document.getElementById('rstBtn').onclick = function() { reset(); };
document.getElementById('recBtn').onclick = function() { if (isRec) stopRec(); else startRec(); };

document.querySelectorAll('.pbtn').forEach(function(b) {
    b.addEventListener('click', function() { goPreset(b.dataset.p); });
});
document.querySelectorAll('.cbtn').forEach(function(b) {
    b.addEventListener('click', function() {
        scheme = parseInt(b.dataset.c);
        document.querySelectorAll('.cbtn').forEach(function(x) {
            x.classList.toggle('active', parseInt(x.dataset.c) === scheme);
        });
        afterViewChange();
    });
});

document.getElementById('iterSlider').addEventListener('input', function() {
    PROG_MAX = parseInt(this.value);
    document.getElementById('iterVal').textContent = PROG_MAX;
    afterViewChange();
});
document.getElementById('durSlider').addEventListener('input', function() {
    recDur = parseInt(this.value);
    document.getElementById('durVal').textContent = recDur;
});

// --- Electron ----------------------------------------------------------------
if (window.electronAPI) {
    window.electronAPI.getAppVersion()
        .then(function(v) { document.getElementById('ver').textContent = 'v' + v; })
        .catch(function() {});
    window.electronAPI.onUpdateStatus(function() {});
} else {
    document.getElementById('ver').textContent = 'Browser';
}

// --- Init --------------------------------------------------------------------
updateHUD();
</script>
</body>
</html>
